# Home Assistant's YAML, from git. The pod mounts configuration.yaml over the
# volume's copy and the packages read-only into /config/packages, so a change
# here is `kubectl apply` plus a restart. What's set in the UI stays on the
# volume (pvc.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-config
  namespace: home-assistant
data:
  configuration.yaml: |
    default_config:

    homeassistant:
      packages: !include_dir_named packages

    # No http: here. Since 2026.10 HA migrates it to storage once and then
    # ignores it, and a new HTTP config must be confirmed within 5 minutes
    # or it reverts; scripts/setup sets the trusted proxies that way.

    # /api/prometheus, scraped with a long-lived token (podmonitor.yaml).
    prometheus:
      namespace: hass

  # The LCARS panel on brick1982 (operations-ivy/rpi_lcars): its
  # lock, and the thermostat's guardrails, which hold for every client, not
  # just the panel. Setpoints are in °F (the US customary unit system).
  lcars_panel.yaml: |
    # The bedroom's own temperature and humidity: the SHT35 on brick1982,
    # read from the panel (/room.json). Read-only: nothing acts on them.
    # Unavailable while the panel or its sensor is down.
    rest:
      - resource: http://brick1982:8767/room.json
        scan_interval: 60
        timeout: 10
        sensor:
          - name: Bedroom temperature
            unique_id: lcars_bedroom_temperature
            value_template: "{{ value_json.temperature_f }}"
            availability: "{{ value_json.up | default(false) }}"
            device_class: temperature
            state_class: measurement
            unit_of_measurement: "°F"
          - name: Bedroom humidity
            unique_id: lcars_bedroom_humidity
            value_template: "{{ value_json.humidity }}"
            availability: "{{ value_json.up | default(false) }}"
            device_class: humidity
            state_class: measurement
            unit_of_measurement: "%"

    # Whether the panel's /room.json answers with a reading, checked by curl
    # outside HA's own HTTP client. The watchdog below compares it with the
    # bedroom sensors.
    command_line:
      - binary_sensor:
          name: LCARS panel room reading
          unique_id: lcars_panel_room_reading
          command: curl -sf -m 10 http://brick1982:8767/room.json
          value_template: "{{ 'on' if value_json is defined and value_json.up else 'off' }}"
          payload_on: "on"
          payload_off: "off"
          scan_interval: 60
      # Whether Google's Calendar API answers, also outside HA's own client
      # (its public discovery document: no token needed). The calendar
      # watchdog below compares it with the calendars.
      - binary_sensor:
          name: Google Calendar API reachable
          unique_id: google_calendar_api_reachable
          command: curl -sf -o /dev/null -m 10 https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest && echo on || echo off
          payload_on: "on"
          payload_off: "off"
          scan_interval: 300

    template:
      # On while any calendar is available. Every calendar here is Google's,
      # so off means the integration is down or stuck, however it got there
      # (entities unavailable, or never set up after a hung reload). Its
      # last_changed is how long; it starts again at each HA start.
      - binary_sensor:
          - name: Calendars available
            unique_id: calendars_available
            state: >-
              {{ states.calendar | rejectattr('state', 'in', ['unavailable', 'unknown']) | list | length > 0 }}

    input_datetime:
      # When the watchdog last restarted HA; restored across restarts.
      lcars_room_watchdog_last_restart:
        name: Bedroom sensor watchdog last restart
        has_date: true
        has_time: true
      lcars_calendar_watchdog_last_restart:
        name: Calendar watchdog last restart
        has_date: true
        has_time: true

    input_number:
      # The guardrails, reset from here on every restart; the panel's arrows
      # stop at them too.
      thermostat_setpoint_min:
        name: Thermostat lowest setpoint
        min: 50
        max: 90
        step: 1
        initial: 64
        unit_of_measurement: "°F"
        mode: box
      thermostat_setpoint_max:
        name: Thermostat highest setpoint
        min: 50
        max: 90
        step: 1
        initial: 76
        unit_of_measurement: "°F"
        mode: box

    input_select:
      # normal: the panel asks for its code before a change. unlocked: no code
      # (a trusted phone, for 10 minutes). hard_locked: no changes from the
      # panel, code or not. Keeps its state across restarts.
      lcars_panel_lock:
        name: LCARS panel lock
        icon: mdi:shield-lock
        options:
          - normal
          - unlocked
          - hard_locked

    automation:
      # HA started while brick1982 was off (2026-10-23) and its rest sensors
      # never recovered: every retry timed out though the panel answered
      # curl, and rest.reload didn't help; only a restart did. So when the
      # panel has had a reading for 15 minutes and HA still has none,
      # restart HA, at most once every 2 hours.
      - id: lcars_bedroom_sensor_watchdog
        alias: Bedroom sensor watchdog
        mode: single
        triggers:
          - trigger: time_pattern
            minutes: "/5"
        conditions:
          - condition: state
            entity_id: binary_sensor.lcars_panel_room_reading
            state: "on"
            for:
              minutes: 15
          - condition: template
            value_template: >-
              {% set s = states.sensor.bedroom_temperature %}
              {{ s is none or (s.state in ['unavailable', 'unknown']
                 and now() - s.last_changed > timedelta(minutes=15)) }}
          # Either watchdog's restart counts: at most one every 2 hours.
          - condition: template
            value_template: >-
              {{ as_timestamp(now()) - [as_timestamp(states('input_datetime.lcars_room_watchdog_last_restart'), 0),
                                        as_timestamp(states('input_datetime.lcars_calendar_watchdog_last_restart'), 0)] | max
                 > 2 * 3600 }}
        actions:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.lcars_room_watchdog_last_restart
            data:
              timestamp: "{{ now().timestamp() }}"
          - action: system_log.write
            data:
              level: warning
              logger: lcars_bedroom_sensor_watchdog
              message: >-
                The panel's /room.json has a reading but sensor.bedroom_temperature
                is {{ states('sensor.bedroom_temperature') }}: restarting Home Assistant.
          - action: homeassistant.restart

      # A burst of Google timeouts (2026-10-27) left every Google calendar
      # unavailable for three days: the integration's sync hung, a reload of
      # it hung too, and only a restart fixed it. So when Google's API has
      # answered for 15 minutes and no calendar has been available for 45
      # (three of their 15-minute polls), restart HA, at most once every 2
      # hours across both watchdogs.
      - id: lcars_calendar_watchdog
        alias: Calendar watchdog
        mode: single
        triggers:
          - trigger: time_pattern
            minutes: "/5"
        conditions:
          - condition: state
            entity_id: binary_sensor.google_calendar_api_reachable
            state: "on"
            for:
              minutes: 15
          - condition: state
            entity_id: binary_sensor.calendars_available
            state: "off"
            for:
              minutes: 45
          - condition: template
            value_template: >-
              {{ as_timestamp(now()) - [as_timestamp(states('input_datetime.lcars_room_watchdog_last_restart'), 0),
                                        as_timestamp(states('input_datetime.lcars_calendar_watchdog_last_restart'), 0)] | max
                 > 2 * 3600 }}
        actions:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.lcars_calendar_watchdog_last_restart
            data:
              timestamp: "{{ now().timestamp() }}"
          - action: system_log.write
            data:
              level: warning
              logger: lcars_calendar_watchdog
              message: >-
                Google's Calendar API answers but no calendar has been available
                for 45 minutes: restarting Home Assistant.
          - action: homeassistant.restart

      - id: lcars_panel_unlock_expires
        alias: LCARS panel unlock expires
        triggers:
          - trigger: state
            entity_id: input_select.lcars_panel_lock
            to: unlocked
            for:
              minutes: 10
        actions:
          - action: input_select.select_option
            target:
              entity_id: input_select.lcars_panel_lock
            data:
              option: normal

      # Pulls any setpoint outside the guardrails back to the nearest one,
      # whoever set it: the panel, the app, or the thermostat's own screen.
      - id: thermostat_guardrails
        alias: Thermostat guardrails
        # Paused while the panel is read-only (the user, 2026-10-15): with it
        # on, HA changes the ecobee whenever anyone sets it outside the
        # guardrails. Delete this line when the panel gets controls back.
        initial_state: false
        mode: queued
        triggers:
          - trigger: state
            entity_id: climate.thermostat
            attribute: temperature
          - trigger: state
            entity_id: climate.thermostat
            attribute: target_temp_low
          - trigger: state
            entity_id: climate.thermostat
            attribute: target_temp_high
          - trigger: state
            entity_id:
              - input_number.thermostat_setpoint_min
              - input_number.thermostat_setpoint_max
          - trigger: homeassistant
            event: start
        variables:
          lo: "{{ states('input_number.thermostat_setpoint_min') | float(64) }}"
          hi: "{{ states('input_number.thermostat_setpoint_max') | float(76) }}"
          t: "{{ state_attr('climate.thermostat', 'temperature') }}"
          low: "{{ state_attr('climate.thermostat', 'target_temp_low') }}"
          high: "{{ state_attr('climate.thermostat', 'target_temp_high') }}"
        actions:
          - choose:
              - conditions: "{{ t is number and (t < lo or t > hi) }}"
                sequence:
                  - action: climate.set_temperature
                    target:
                      entity_id: climate.thermostat
                    data:
                      temperature: "{{ [[t, lo] | max, hi] | min }}"
              - conditions: >-
                  {{ low is number and high is number
                     and (low < lo or high > hi) }}
                sequence:
                  - action: climate.set_temperature
                    target:
                      entity_id: climate.thermostat
                    data:
                      target_temp_low: "{{ [[low, lo] | max, hi] | min }}"
                      target_temp_high: "{{ [[high, lo] | max, hi] | min }}"
