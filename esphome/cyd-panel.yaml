interval:
  # The clock, with a blinking cursor.
  - interval: 1s
    then:
      - if:
          condition: {lambda: "return id(ha_time).now().is_valid();"}
          then:
            - lambda: id(cursor_on) = !id(cursor_on);
            - lvgl.label.update:
                id: status_clock
                text: !lambda |-
                  return id(ha_time).now().strftime("%H:%M") + (id(cursor_on) ? "_" : " ");
            - lvgl.label.update:
                id: status_date
                text: !lambda return id(ha_time).now().strftime("%a %b %d");
            - lvgl.label.update:
                id: status_year
                text: !lambda return id(ha_time).now().strftime("%Y-%m-%d");
